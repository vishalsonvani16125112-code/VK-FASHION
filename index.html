<script>
function searchProduct(){

let text = document.getElementById("searchInput").value.toLowerCase().trim();

if(text.includes("sky blue")){
    window.location.href = "tshirt1.html";
}

else if(text.includes("black")){
    window.location.href = "tshirt2.html";
}

else if(text.includes("cream")){
    window.location.href = "tshirt3.html";
}

else if(text.includes("women") || text.includes("top") || text.includes("kurti")){
    window.location.href = "women.html";
}

else if(text.includes("kids") || text.includes("boy") || text.includes("girl")){
    window.location.href = "kids.html";
}

else if(text.includes("men") || text.includes("tshirt") || text.includes("shirt")){
    window.location.href = "men.html";
}

else{
    alert("Product not found!");
}

  }
</script>

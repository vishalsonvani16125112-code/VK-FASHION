<!DOCTYPE html>
<html>
<head>
<title>Order Page</title>

<style>
body{
  font-family: Arial, sans-serif;
  text-align:center;
  background:linear-gradient(135deg,#f5f5f5,#e9e9e9);
  margin:0;
  padding:20px 0;
  color:#222;
}

.order-box{
  background:white;
  width:94%;
  max-width:500px;
  min-height:600px;
  margin:30px auto;
  padding:30px 25px;
  border-radius:15px;
  box-shadow:0 8px 25px rgba(0,0,0,0.12);
  box-sizing:border-box;
}

.order-box h2{
  margin-bottom:20px;
  font-size:25px;
  color:#111;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
  box-sizing:border-box;
  font-size:15px;
  outline:none;
  background:#fafafa;
  transition:0.3s;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#111;
  background:white;
  box-shadow:0 0 5px rgba(0,0,0,0.15);
}

textarea{
  height:90px;
  resize:none;
}

button{
  width:100%;
  background:#111;
  color:white;
  padding:13px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#333;
  transform:translateY(-2px);
  box-shadow:0 5px 12px rgba(0,0,0,0.2);
}

button:active{
  transform:scale(0.98);
}
</style>

</head>

<body>

<h1>Place Your Order</h1>

<div class="order-box">

<h2>Customer Details</h2>
<input type="text" id="name" placeholder="Your Name">

<input type="number" id="mobile" placeholder="Mobile Number">

<textarea id="address" placeholder="Full Address"></textarea>
  <input type="email" id="email" placeholder="Email Address">

<input type="text" id="city" placeholder="City">

<input type="text" id="state" placeholder="State">

<input type="number" id="pincode" placeholder="PIN Code">
  
<select id="payment">
<option>Select Payment Method</option>
<option>Cash On Delivery</option>
<option>Online Payment</option>
</select>

<br>

<button onclick="placeOrder()">Place Order</button>

</div>
<script type="module">
alert("Script Loaded");
import { auth, db } from "./firebase.js";

import { onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
  addDoc,
  collection,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

let firebaseUser = null;

onAuthStateChanged(auth, (user) => {

  if (!user) {
    alert("Please Login First");
    window.location.href = "login.html";
    return;
  }

  firebaseUser = user;

});

window.placeOrder = async function () {
  alert("Place Order Clicked");

  let name = document.getElementById("name").value.trim();
  let mobile = document.getElementById("mobile").value.trim();
  let email = document.getElementById("email").value.trim();
  let address = document.getElementById("address").value.trim();
  let city = document.getElementById("city").value.trim();
  let state = document.getElementById("state").value.trim();
  let pincode = document.getElementById("pincode").value.trim();
  let payment = document.getElementById("payment").value;

  if (name === "") {
    alert("Please enter your name.");
    return;
  }

  if (!/^[0-9]{10}$/.test(mobile)) {
    alert("Please enter a valid 10-digit mobile number.");
    return;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert("Please enter a valid email address.");
    return;
  }

  if (address === "") {
    alert("Please enter your address.");
    return;
  }

  if (city === "") {
    alert("Please enter your city.");
    return;
  }

  if (state === "") {
    alert("Please enter your state.");
    return;
  }

  if (!/^[0-9]{6}$/.test(pincode)) {
    alert("Please enter a valid 6-digit PIN Code.");
    return;
  }

  if (payment === "Select Payment Method") {
    alert("Please select a payment method.");
    return;
  }

  if (!firebaseUser) {
    alert("Please Login First");
    return;
  }

  try {

    await addDoc(collection(db, "orders"), {
      userEmail: firebaseUser.email,
      name: name,
      mobile: mobile,
      email: email,
      address: address,
      city: city,
      state: state,
      pincode: pincode,
      payment: payment,
      status: "Pending",
      createdAt: serverTimestamp()
    });

    alert("✅ Order Placed Successfully!");

    window.location.href = "myorders.html";

  } catch (error) {

    alert("Order Failed: " + error.message);
    console.error(error);

  }

};

</script>
</body>
</html>
